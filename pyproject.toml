[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "math-concept-representations"
version = "0.1.0"
description = "Layer-wise evolution of mathematical concept representations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.28",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "tqdm>=4.66",
    "pyarrow>=14.0",
    "umap-learn>=0.5.5",
    "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
